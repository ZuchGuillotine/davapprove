services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DAVAPPROVE_MODE: supabase
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set the frontend HTTPS origin}
      DATA_DIR: /data
      MAX_PDF_BYTES: ${MAX_PDF_BYTES:-52428800}
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
    volumes:
      - temporary:/data
    expose:
      - "8000"
    mem_limit: 768m
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      DAVAPPROVE_MODE: supabase
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set server-only worker key}
      DATA_DIR: /data
      MAX_PDF_BYTES: ${MAX_PDF_BYTES:-52428800}
      AI_PROVIDER: ${AI_PROVIDER:-legacy}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_INPUT_USD_PER_MILLION: ${AI_INPUT_USD_PER_MILLION:-0}
      AI_OUTPUT_USD_PER_MILLION: ${AI_OUTPUT_USD_PER_MILLION:-0}
      AI_MONTHLY_USD: ${AI_MONTHLY_USD:-25}
    volumes:
      - temporary:/data
    mem_limit: 2g
    cpus: 1.5
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  proxy:
    image: caddy:2.10.2-alpine
    profiles: [domain]
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [preview]
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8000"]
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      api:
        condition: service_healthy
volumes:
  temporary:
  caddy_data:
  caddy_config:
