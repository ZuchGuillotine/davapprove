name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: davapprove_test
          POSTGRES_PASSWORD: disposable-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: davapprove_test
      PGPASSWORD: disposable-test-password
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/supabase_bootstrap.sql
      - run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: psql -v ON_ERROR_STOP=1 -f tests/rls_assertions.sql
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - run: PYTHONPATH=backend pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/report_logic.test.cjs
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Bid assessment checks
        run: |
          node ../bid-assistant/build.js --check
          node ../tests/bid_assistant_engine.test.cjs
          node ../tests/bid_assistant_geo.test.cjs
          node ../tests/bid_assistant_drafts.test.cjs
          node ../tests/bid_assistant_ui.test.cjs
      - run: npm run build
      - run: npx wrangler deploy --dry-run
  ai-proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-proxy/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
